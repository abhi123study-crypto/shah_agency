<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Shah Agency</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
        }
        input { 
            width: 90%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #000; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 15px; 
        }
        button:hover { 
            background: #333; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Shah Agency</h2>
        <p>Secure Admin Panel</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="loginAPI()">Login</button>
    </div>

    <script>
        function loginAPI() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Direct local check (Render server ka wait nahi karega)
            if (user === 'abhishek' && pass === 'shahadmin123') {
                
                // Token set kar raha hai taaki andar wale pages khul sakein
                localStorage.setItem('auth_token', 'shah_agency_secure_token');
                
                // Seedha Dashboard par bhej dega
                window.location.href = 'dashboard.html';
                
            } else {
                alert('Galat Username ya Password! Wapas try kar.');
            }
        }
    </script>
</body>
</html>
