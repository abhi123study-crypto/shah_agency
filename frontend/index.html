<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Shah Agency</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-container">

    <div class="brand-side">

        <div class="brand-badge">
            BSc IT Major Project
        </div>

        <h1>
            Agency
        </h1>

        <h2>
            Godown Management System
        </h2>

        <p>
            Manage inventory, retailers, billing and payments
            from a single professional dashboard. Bsc IT major project by Abhishek Shah.
        </p>

    </div>

    <div class="login-card">

        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue</p>
        </div>

        <!-- SAME IDS -->
        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <!-- SAME FUNCTION -->
        <button onclick="loginAPI()">
            Login
        </button>

        <div class="footer-note">
            Shah Agency Admin Page
        </div>

    </div>

</div>

<script>
    function loginAPI() {

        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === 'abhishek' && pass === 'shahadmin123') {

            localStorage.setItem(
                'auth_token',
                'shah_agency_secure_token'
            );

            window.location.href = 'dashboard.html';

        } else {

            alert(
                'Wrong Username or Password! try again.'
            );

        }
    }
</script>

</body>
</html>
