<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - Shah Agency</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <h2>Shah Agency</h2>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="godown.html">Godown</a></li>
            <li><a href="retailer.html">Retailers</a></li>
            <li><a href="billing.html">Billing</a></li>
            <li><a href="payment-history.html">Payment History</a></li> 
        </ul>
    </nav>

    <main class="page-container">
        <h1>Create New Bill / Invoice</h1>
        
        <div class="split-layout">
            <div class="form-section box-card">
                <h3>Add Items to Bill</h3>
                <form id="add-to-bill-form">
                    
                    <div class="input-group">
                        <label>Select Retailer</label>
                        <select id="bill-retailer" required>
                            <option value="">-- Choose Shop --</option>
                            <option value="Gupta Store">Gupta General Store</option>
                            <option value="Sharma Kirana">Sharma Kirana</option>
                        </select>
                    </div>
                    
                    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ecf0f1;">
                    
                    <div class="input-group">
                        <label>Select Product</label>
                        <select id="bill-product" required>
                            <option value="">-- Choose Item --</option>
                            <option value="Parle-G">Parle-G</option>
                            <option value="Surf Excel">Surf Excel</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Price per unit (₹)</label>
                        <input type="number" id="bill-price" required placeholder="10">
                    </div>
                    <div class="input-group">
                        <label>Quantity</label>
                        <input type="number" id="bill-qty" required placeholder="e.g. 10">
                    </div>
                    
                    <button type="submit" class="primary-btn">Add to Bill</button>
                </form>
            </div>

            <div class="list-section box-card">
                <h3>Current Invoice</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="invoice-list">
                        </tbody>
                </table>
                
                <div style="text-align: right; margin-top: 30px;">
                    <h2 style="color: #2c3e50;">Grand Total: <span style="color: #27ae60;" id="grand-total">₹ 0</span></h2>
                    <button id="generate-bill-btn" class="primary-btn" style="width: auto; background-color: #27ae60; padding: 12px 30px;">Complete Order & Print</button>
                </div>
            </div>
        </div>
    </main>
<script src="js/billing.js"></script>
    </body>
</html>
