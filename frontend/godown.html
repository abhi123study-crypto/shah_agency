<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godown - Shah Agency</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
    // Security Lock
    if (localStorage.getItem('auth_token') !== 'shah_agency_secure_token') {
        window.location.href = 'index.html';
    }
    function logout() {
        localStorage.removeItem('auth_token');
        window.location.href = 'index.html';
    }
    </script>
</head>
<body>

    <nav class="navbar">
        <h2>Shah Agency</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="godown.html">Godown</a></li>
            <li><a href="retailer.html">Retailers</a></li>
            <li><a href="billing.html">Billing</a></li>
            <li><a href="payment-history.html">Payment History</a></li> 
            <li><a href="#" onclick="logout()" style="color: #ff4d4d; font-weight: bold;">Logout</a></li>
        </ul>
    </nav>

    <main class="page-container">
        <h1>Godown Inventory</h1>
        
        <div class="split-layout">
            <div class="form-section box-card">
                <h3>Add / Edit Product</h3>
                <form id="add-product-form">
                    <input type="hidden" id="edit-mode-sku" value="">

                    <div class="input-group">
                        <label>Product Name</label>
                        <input type="text" id="p-name" required placeholder="e.g. Parle-G Gold">
                    </div>

                    <div class="input-group">
                        <label>Category / Product Type</label>
                        <select id="p-category" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
                            <option value="">-- Select Type --</option>
                            <option value="Bakery & Biscuits">Bakery & Biscuits</option>
                            <option value="Snacks & Chips">Snacks & Chips</option>
                            <option value="Beverages / Cold Drinks">Beverages / Cold Drinks</option>
                            <option value="Personal Care / Soaps">Personal Care / Soaps</option>
                            <option value="Packaged Foods">Packaged Foods</option>
                            <option value="Other">Other (Add Custom Category)...</option>
                        </select>
                        <input type="text" id="custom-category" placeholder="Type custom category name here" style="display: none; width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-top: 10px; font-family: inherit;">
                    </div>

                    <div class="input-group">
                        <label>Price (₹)</label>
                        <input type="number" id="product-price" step="0.01" placeholder="Enter Price" required>
                    </div>

                    <div class="input-group">
                        <label>GST Rate (%)</label>
                        <input type="number" id="p-gst-rate" value="18" step="0.1" required>
                    </div>

                    <div class="input-group">
                        <label>Initial Stock (Qty)</label>
                        <input type="number" id="p-stock" required placeholder="e.g. 100">
                    </div>

                    <div class="input-group">
                        <label>SKU / Barcode Code</label>
                        <input type="text" id="p-sku" required placeholder="e.g. PARLE-G-10">
                    </div>

                    <button type="submit" id="submit-btn" class="primary-btn">Save Product</button>
                </form>
            </div>

            <div class="box-card">
                <h3>Current Stock</h3>
                
                <div style="margin-bottom: 1rem;">
                    <input type="text" id="search-input" placeholder="Search by name, SKU or category..." 
                           style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 2px; font-family: inherit;">
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>SKU</th>
                            <th>NAME</th>
                            <th>CATEGORY</th>
                            <th>PRICE</th>
                            <th>STOCK</th>
                            <th>ACTION</th> </tr>
                    </thead>
                    <tbody id="product-list">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/godown.js"></script>
</body>
</html>
